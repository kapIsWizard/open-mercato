name: Preview Deploy

# Deploys a per-PR preview environment to Dokploy.
#
# Trigger conditions:
#   - PR targets `develop`
#   - PR is from the main repo (not a fork)
#   - PR has the `preview-env` label
#
# Required GitHub secrets:
#   DOKPLOY_URL             - e.g. https://dokploy.yourdomain.com
#   DOKPLOY_API_KEY         - Dokploy API key
#   PREVIEW_JWT_SECRET      - JWT secret used for all preview envs
#   PREVIEW_POSTGRES_PASSWORD - Postgres password for preview envs
#
# Required GitHub vars:
#   DOKPLOY_PROJECT_ID      - Dokploy project ID where stacks are created
#   PREVIEW_BASE_DOMAIN     - base domain, e.g. preview.openmercato.com
#                             → preview URL becomes pr-123.preview.openmercato.com

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [develop]

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview-env')

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute metadata
        id: meta
        run: |
          set -euo pipefail

          PR="${{ github.event.pull_request.number }}"
          SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${SHA:0:7}"
          DEPLOY_ENV="pr-${PR}"
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"

          echo "pr=$PR"                                      >> "$GITHUB_OUTPUT"
          echo "deploy_env=$DEPLOY_ENV"                     >> "$GITHUB_OUTPUT"
          echo "image_full=${IMAGE}:${DEPLOY_ENV}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "preview_hostname=${DEPLOY_ENV}.${{ vars.PREVIEW_BASE_DOMAIN }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.image_full }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Find existing compose ID from PR comment
        id: existing
        uses: actions/github-script@v7
        with:
          script: |
            const markerPrefix = '<!-- preview-compose-id ';
            const markerSuffix = ' -->';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.meta.outputs.pr }},
              per_page: 100,
            });

            for (let i = comments.length - 1; i >= 0; i--) {
              const body = comments[i].body || '';
              const start = body.indexOf(markerPrefix);
              if (start === -1) continue;

              const after = body.substring(start + markerPrefix.length);
              const end = after.indexOf(markerSuffix);
              if (end === -1) continue;

              const id = after.substring(0, end).trim();
              if (id) {
                core.info(`Found existing compose ID: ${id}`);
                core.setOutput('compose_id', id);
                return;
              }
            }

            core.setOutput('compose_id', '');

      - name: Upsert Dokploy compose stack
        id: compose
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_PROJECT_ID: ${{ vars.DOKPLOY_PROJECT_ID }}
          DOKPLOY_ENVIRONMENT_ID: ${{ vars.DOKPLOY_ENVIRONMENT_ID }}
          EXISTING_COMPOSE_ID: ${{ steps.existing.outputs.compose_id }}
          DEPLOY_ENV: ${{ steps.meta.outputs.deploy_env }}
          PREVIEW_IMAGE: ${{ steps.meta.outputs.image_full }}
          PREVIEW_HOSTNAME: ${{ steps.meta.outputs.preview_hostname }}
          JWT_SECRET: ${{ secrets.PREVIEW_JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.PREVIEW_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail

          COMPOSE_FILE=$(cat docker-compose.preview-env.yaml)

          # Build the env file content that Dokploy injects into the compose stack
          ENV_CONTENT=$(cat <<EOF
          DEPLOY_ENV=${DEPLOY_ENV}
          PREVIEW_IMAGE=${PREVIEW_IMAGE}
          PREVIEW_HOSTNAME=${PREVIEW_HOSTNAME}
          APP_URL=https://${PREVIEW_HOSTNAME}
          JWT_SECRET=${JWT_SECRET}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          MEILISEARCH_MASTER_KEY=meilisearch-preview-key
          ADMIN_EMAIL=admin@preview.local
          OM_INIT_SUPERADMIN_EMAIL=admin@preview.local
          OM_INIT_SUPERADMIN_PASSWORD=preview123
          EOF
          )

          if [[ -z "$EXISTING_COMPOSE_ID" ]]; then
            echo "Creating new compose stack: ${DEPLOY_ENV}"
            RESP=$(curl -fsS -X POST "${DOKPLOY_URL}/api/compose.create" \
              -H "x-api-key: ${DOKPLOY_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg name "$DEPLOY_ENV" \
                --arg projectId "$DOKPLOY_PROJECT_ID" \
                --arg environmentId "$DOKPLOY_ENVIRONMENT_ID" \
                '{name: $name, projectId: $projectId, environmentId: $environmentId, composeType: "docker-compose"}')")

            COMPOSE_ID=$(echo "$RESP" | jq -r '.composeId')
            if [[ -z "$COMPOSE_ID" || "$COMPOSE_ID" == "null" ]]; then
              echo "Failed to create compose stack. Response: $RESP" >&2
              exit 1
            fi
            echo "Created compose stack: ${COMPOSE_ID}"
          else
            COMPOSE_ID="$EXISTING_COMPOSE_ID"
            echo "Updating existing compose stack: ${COMPOSE_ID}"
          fi

          # Update compose file content and env vars
          curl -fsS -X POST "${DOKPLOY_URL}/api/compose.update" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg composeId "$COMPOSE_ID" \
              --arg env "$ENV_CONTENT" \
              --arg composeFile "$COMPOSE_FILE" \
              '{composeId: $composeId, env: $env, composeFile: $composeFile}')"

          # Trigger deploy
          curl -fsS -X POST "${DOKPLOY_URL}/api/compose.deploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg composeId "$COMPOSE_ID" '{composeId: $composeId}')"

          echo "compose_id=$COMPOSE_ID" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr         = ${{ steps.meta.outputs.pr }};
            const composeId  = "${{ steps.compose.outputs.compose_id }}";
            const deployEnv  = "${{ steps.meta.outputs.deploy_env }}";
            const image      = "${{ steps.meta.outputs.image_full }}";
            const branch     = "${{ github.event.pull_request.head.ref }}";
            const previewUrl = `https://${{ steps.meta.outputs.preview_hostname }}/backend`;

            // compose-id marker is parsed by preview-cleanup.yml on PR close
            const composeMarker = `<!-- preview-compose-id ${composeId} -->`;
            const bodyMarker    = '<!-- preview-env-comment -->';

            const body = [
              bodyMarker,
              composeMarker,
              `🚀 Preview deployed to **${deployEnv}**`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **URL** | ${previewUrl} |`,
              `| **Branch** | \`${branch}\` |`,
              `| **Image** | \`${image}\` |`,
              `| **Login** | admin@preview.local / preview123 |`,
              ``,
              `_Environment resets on every push — all data is demo data._`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });

            const existing = comments.find(c => c.body?.includes(bodyMarker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }
